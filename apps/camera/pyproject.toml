[project]
name = "attendance-camera"
version = "0.1.0"
description = "AI Employee Attendance - camera integration service (RTSP / USB / TEST providers)"
requires-python = ">=3.12,<3.15"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
