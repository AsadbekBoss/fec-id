[project]
name = "attendance-api"
version = "0.1.0"
description = "AI Employee Attendance — Core API"
requires-python = ">=3.12,<3.15"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# asserts; non-crypto random data; Uzbek ʻ letters; fake test passwords; fixed test SQL
"tests/**" = ["S101", "S311", "RUF001", "S105", "S106", "S608", "ASYNC240"]
# Uzbek apostrophe variants are the subject of these files
"app/core/text.py" = ["RUF001", "RUF002", "RUF003"]
"app/schemas/employees.py" = ["RUF001"]
"migrations/**" = ["E501"]  # long SQL / generated lines

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
