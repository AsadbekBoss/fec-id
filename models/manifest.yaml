# Model licence manifest (DEVELOPMENT_RULES §8, ARCHITECTURE §10).
# The recognition service refuses to load any model that is not listed here, whose SHA-256 does
# not match, or whose commercial_use is "forbidden" (unless research mode is explicitly enabled
# outside production). Weight files themselves are NEVER committed to git.
#
# commercial_use:
#   allowed   - the licence permits commercial use (still subject to legal review of training data)
#   licensed  - a commercial licence has been purchased (store proof at license_proof)
#   forbidden - research / non-commercial only
#
# sha256 values for OpenCV Zoo models are the official Git LFS object ids of the
# opencv/opencv_zoo repository (verified 2026-11-08).

models:
  - name: yunet
    version: "2023mar"
    task: detection
    backend: opencv
    file: face_detection_yunet_2023mar.onnx
    url: https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
    sha256: "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
    size: 232589
    license: MIT
    license_url: https://github.com/opencv/opencv_zoo/blob/main/models/face_detection_yunet/LICENSE
    commercial_use: allowed
    license_proof: "MIT LICENSE file in opencv_zoo (checked 2026-11-08)"
    notes: "Trained on WIDER FACE. Dataset terms are a residual legal question for counsel."

  - name: sface
    version: "2021dec"
    task: embedding
    backend: opencv
    file: face_recognition_sface_2021dec.onnx
    url: https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
    sha256: "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79"
    size: 38696353
    license: Apache-2.0
    license_url: https://github.com/opencv/opencv_zoo/blob/main/models/face_recognition_sface/LICENSE
    commercial_use: allowed
    license_proof: "Apache-2.0 LICENSE file in opencv_zoo (checked 2026-11-08)"
    embedding_dim: 128
    reference_threshold: 0.363  # OpenCV's published cosine threshold. MUST be re-calibrated on pilot data.
    notes: "Lower accuracy than ArcFace-R100. Benchmark on consented pilot data before production."

  # InsightFace pretrained models: code is MIT, but the WEIGHTS are licensed for non-commercial
  # research only. A company using them for its own employees is commercial use, so a commercial
  # licence from InsightFace is required (decision D2). Files are not downloaded by the tooling:
  # place them in models/ manually and fill in sha256 after obtaining them legitimately.
  - name: scrfd_10g
    version: "buffalo_l"
    task: detection
    backend: onnxruntime
    file: det_10g.onnx
    url: null
    sha256: null
    license: "InsightFace pretrained models - non-commercial research only"
    license_url: https://github.com/deepinsight/insightface#license
    commercial_use: forbidden
    license_proof: null

  - name: arcface_w600k_r50
    version: "buffalo_l"
    task: embedding
    backend: onnxruntime
    file: w600k_r50.onnx
    url: null
    sha256: null
    license: "InsightFace pretrained models - non-commercial research only"
    license_url: https://github.com/deepinsight/insightface#license
    commercial_use: forbidden
    license_proof: null
    embedding_dim: 512
    reference_threshold: 0.40  # placeholder; calibrate
